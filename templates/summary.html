<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summary - Hostel Food</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Feedback Summary</h2>

  <div class="row mb-4">
    <div class="col-md-6">
      <h5 class="text-center">Feedback Distribution</h5>
      <canvas id="pieChart"></canvas>
    </div>
    <div class="col-md-6">
      <h5 class="text-center">Meal-wise Average</h5>
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-md-10 offset-md-1">
      <h5 class="text-center">Last 7 Days Trend</h5>
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <div class="text-center">
    <button class="btn btn-success me-2" onclick="exportPDF()">Download PDF Report</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">Back to Dashboard</a>
  </div>
</div>

<script>
  // Pie Chart
  const pieCtx = document.getElementById('pieChart').getContext('2d');
  const pieChart = new Chart(pieCtx, {
    type: 'pie',
    data: {
      labels: ['Good (4-5)', 'Average (3)', 'Poor (1-2)'],
      datasets: [{
        data: {{ feedback_distribution | safe }},
        backgroundColor: ['#28a745', '#ffc107', '#dc3545']
      }]
    }
  });

  // Bar Chart for meal averages
  const barCtx = document.getElementById('barChart').getContext('2d');
  const barChart = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: {{ meal_labels | safe }},
      datasets: [{
        label: 'Average Rating',
        data: {{ meal_avg_ratings | safe }},
        backgroundColor: 'rgba(54,162,235,0.6)',
        borderColor: 'rgba(54,162,235,1)',
        borderWidth: 1
      }]
    },
    options: { scales: { y: { beginAtZero: true, max: 5 } } }
  });

  // Trend chart (line)
  const trendCtx = document.getElementById('trendChart').getContext('2d');
  const trendChart = new Chart(trendCtx, {
    type: 'line',
    data: {
      labels: {{ trend_labels | safe }},
      datasets: [{
        label: '7-day Average Rating',
        data: {{ trend_avgs | safe }},
        fill: false,
        tension: 0.3,
        borderWidth: 2
      }]
    },
    options: { scales: { y: { beginAtZero: true, max: 5 } } }
  });

  // Export to PDF
  function exportPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation: 'portrait'});
    doc.setFontSize(16);
    doc.text('Hostel Food Feedback Summary', 14, 20);

    // Add pie chart
    const pieImg = pieChart.toBase64Image();
    doc.addImage(pieImg, 'PNG', 15, 30, 180, 80);

    // Add bar chart
    const barImg = barChart.toBase64Image();
    doc.addImage(barImg, 'PNG', 15, 115, 180, 80);

    // Add trend chart on next page
    doc.addPage();
    doc.text('Last 7 Days Trend', 14, 20);
    const trendImg = trendChart.toBase64Image();
    doc.addImage(trendImg, 'PNG', 15, 30, 180, 100);

    doc.save('hostel_food_summary.pdf');
  }
</script>
</body>
</html>
