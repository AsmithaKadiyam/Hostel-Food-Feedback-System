<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hostel Food Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container mt-5">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h2 class="text-center mb-4">Hostel Food Feedback</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      {% endwith %}

      <form action="{{ url_for('submit_feedback') }}" method="POST" class="needs-validation" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Your Name</label>
          <input type="text" class="form-control" id="name" name="name" required>
          <div class="invalid-feedback">Please enter your name.</div>
        </div>

        <div class="mb-3">
          <label for="room" class="form-label">Room Number</label>
          <input type="text" class="form-control" id="room" name="room">
        </div>

        <div class="mb-3">
          <label for="meal" class="form-label">Meal Type</label>
          <select class="form-select" id="meal" name="meal" required>
            <option value="">Select Meal</option>
            <option value="Breakfast">Breakfast</option>
            <option value="Lunch">Lunch</option>
            <option value="Dinner">Dinner</option>
          </select>
          <div class="invalid-feedback">Please select a meal type.</div>
        </div>

        <div class="mb-3">
          <label for="rating" class="form-label">Rating</label>
          <select class="form-select" id="rating" name="rating" required>
            <option value="">Select Rating</option>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Good</option>
            <option value="3">3 - Average</option>
            <option value="2">2 - Poor</option>
            <option value="1">1 - Very Poor</option>
          </select>
          <div class="invalid-feedback">Please give a rating.</div>
        </div>

        <div class="mb-3">
          <label for="comment" class="form-label">Comments (optional)</label>
          <textarea class="form-control" id="comment" name="comment" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Submit Feedback</button>
      </form>

      <div class="mt-3 d-flex justify-content-between">
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">View Dashboard</a>
        <a href="{{ url_for('summary') }}" class="btn btn-outline-success">View Summary</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Bootstrap client-side validation
  (function () {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')
    Array.from(forms).forEach(function (form) {
      form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false)
    })
  })();
</script>
</body>
</html>
